{% extends 'base.html' %}{% block title %}Categories{% endblock %}{% block content %}<div class="page-head"><div><h1>Categories</h1><p>Organize the store's product catalog.</p></div></div><section class="panel"><form method="post" class="inline-form"><label>Category name<input name="categoryname" maxlength="40" required></label><button class="primary">Add category</button></form><table><thead><tr><th>Category</th><th>Products</th><th></th></tr></thead><tbody>{% for c in categories %}<tr><td>{{ c.categoryname }}</td><td>{{ c.products|length }}</td><td><form method="post" action="{{ url_for('delete_category', category_id=c.categoryid) }}" onsubmit="return confirm('Delete this category?')"><button class="danger small-button">Delete</button></form></td></tr>{% else %}<tr><td colspan="3" class="empty">No categories.</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
