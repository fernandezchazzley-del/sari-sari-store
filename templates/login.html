{% extends "base.html" %}

{% block title %}Login | Joyo Family Store{% endblock %}

{% block content %}

<div class="login-container">
    <div class="login-card">
        <h1>JOYO FAMILY STORE</h1>
        <p>Store Management System</p>

        <h2>Welcome Back!</h2>
        <p class="muted">Please log in to continue.</p>

        <form method="POST">
            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <p class="login-footer">Joyo Family Store Management System</p>
    </div>
</div>

{% endblock %}
